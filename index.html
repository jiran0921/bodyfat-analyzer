<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体脂率估算</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --border: #2a2a38;
      --text: #e0e0e0;
      --text-secondary: #888;
      --accent: #c4943a;
      --accent-glow: rgba(196,148,58,0.3);
      --danger: #d44;
      --success: #4a8;
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    header {
      text-align: center; padding: 24px 0 16px;
    }
    header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.02em; }
    .badge {
      display: inline-block; background: var(--accent); color: #000;
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; margin-left: 8px; vertical-align: middle; text-transform: uppercase;
    }
    header .subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }

    /* Auth */
    .auth-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
    }
    .auth-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
    .auth-section .field { margin-bottom: 12px; }
    .auth-section .field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
    .auth-section .field input {
      width: 100%; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.95rem; outline: none;
    }
    .auth-section .field input:focus { border-color: var(--accent); }
    .auth-buttons { display: flex; gap: 8px; }
    .auth-buttons button {
      flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: all 0.2s; border: 1px solid var(--accent);
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { box-shadow: 0 0 16px var(--accent-glow); }
    .btn-secondary { background: transparent; color: var(--accent); }
    .btn-secondary:hover { background: rgba(196,148,58,0.1); }
    .auth-error { color: var(--danger); font-size: 0.8rem; margin-top: 8px; display: none; }
    .auth-switch { text-align: center; margin-top: 12px; font-size: 0.8rem; color: var(--text-secondary); }
    .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }

    /* User bar */
    .user-bar {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 16px; font-size: 0.8rem; color: var(--text-secondary);
    }
    .user-bar .email { color: var(--accent); }
    .user-bar button {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
      transition: all 0.2s;
    }
    .user-bar button:hover { border-color: var(--danger); color: var(--danger); }

    /* Form */
    .form-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .form-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 100px; margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .gender-toggle { display: flex; gap: 8px; }
    .gender-toggle button {
      flex: 1; padding: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text-secondary); border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }
    .gender-toggle button.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

    /* Photo panels */
    .photo-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 500px) { .photo-panels { grid-template-columns: 1fr; } }
    .photo-panel {
      background: var(--surface); border: 2px dashed var(--border);
      border-radius: var(--radius); overflow: hidden; position: relative;
      aspect-ratio: 3/4; cursor: pointer; transition: border-color 0.2s;
    }
    .photo-panel:hover { border-color: var(--accent); }
    .photo-panel.has-photo { border-style: solid; border-color: var(--accent); }
    .photo-panel .placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--text-secondary); pointer-events: none;
    }
    .photo-panel .placeholder .icon { font-size: 2rem; opacity: 0.5; }
    .photo-panel img, .photo-panel canvas { width: 100%; height: 100%; object-fit: contain; }
    .photo-panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo-panel .label-tag {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
      color: var(--accent); font-size: 0.75rem; padding: 4px 10px;
      border-radius: 4px; z-index: 2; pointer-events: none;
    }
    .photo-panel .retake-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
      border: 1px solid var(--border); color: var(--text); font-size: 0.7rem;
      padding: 4px 10px; border-radius: 4px; cursor: pointer; z-index: 2;
    }
    .photo-panel .retake-btn:hover { background: var(--danger); }
    .upload-actions {
      display: flex; gap: 8px; position: absolute; bottom: 12px;
      left: 50%; transform: translateX(-50%); z-index: 2;
    }
    .upload-actions button {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.8); color: var(--text); font-size: 0.75rem;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .upload-actions button:hover { background: var(--accent); color:#000; }
    .photo-panel.has-photo .upload-actions { display: none; }

    /* Buttons */
    .btn-analyze {
      width: 100%; padding: 14px; background: var(--accent); color: #000;
      border: none; border-radius: var(--radius); font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em;
    }
    .btn-analyze:hover { box-shadow: 0 0 24px var(--accent-glow); }
    .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* Results */
    .results {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-top: 16px; display: none;
    }
    .results.visible { display: block; }
    .bf-big-number { text-align: center; margin-bottom: 20px; }
    .bf-value { font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
    .bf-value.excellent { color: #4a8; } .bf-value.good { color: #8b4; }
    .bf-value.fair { color: var(--accent); } .bf-value.poor { color: #d84; }
    .bf-value.high { color: var(--danger); }
    .bf-label { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
    .bf-scale {
      display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px;
    }
    .bf-scale .seg { flex: 1; }
    .bf-scale .seg.e { background: #4a8; } .bf-scale .seg.g { background: #8b4; }
    .bf-scale .seg.f { background: var(--accent); } .bf-scale .seg.p { background: #d84; }
    .bf-scale .seg.h { background: var(--danger); }
    .bf-indicator { position: relative; height: 20px; margin-bottom: 18px; }
    .bf-indicator .arrow {
      position: absolute; top: 0; transform: translateX(-50%);
      font-size: 0.8rem; transition: left 0.5s ease;
    }
    .measurements-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .meas-card {
      background: var(--bg); border-radius: 8px; padding: 12px; text-align: center;
    }
    .meas-card .val { font-size: 1.3rem; font-weight: 700; }
    .meas-card .lbl { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
    .disclaimer {
      margin-top: 16px; padding: 12px; background: rgba(196,148,58,0.08);
      border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
      font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5;
    }

    /* History */
    .history-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-top: 16px; display: none;
    }
    .history-section.visible { display: block; }
    .history-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; color: var(--accent); }
    .chart-wrap { margin-bottom: 20px; position: relative; height: 220px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .history-table th {
      text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
      color: var(--text-secondary); font-weight: 600; font-size: 0.72rem;
    }
    .history-table td {
      padding: 8px 6px; border-bottom: 1px solid rgba(42,42,56,0.5);
    }
    .history-table .delete-btn {
      background: transparent; border: none; color: var(--text-secondary);
      cursor: pointer; font-size: 0.9rem; padding: 2px 6px; opacity: 0.5;
      transition: all 0.2s;
    }
    .history-table .delete-btn:hover { opacity: 1; color: var(--danger); }
    .no-history {
      text-align: center; color: var(--text-secondary); padding: 24px; font-size: 0.85rem;
    }

    /* Toast */
    .error-toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 0.85rem; z-index: 100;
      animation: fadeIn 0.3s; display: none;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(-8px); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>体脂率估算<span class="badge">Pro</span></h1>
    <p class="subtitle">正面 + 侧面各一张照片，US Navy 公式估算 · 云端记录</p>
  </header>

  <!-- Auth UI -->
  <div class="auth-section" id="authSection">
    <h3>登录或注册</h3>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="your@email.com">
    </div>
    <div class="field">
      <label>密码（至少6位）</label>
      <input type="password" id="authPassword" placeholder="至少6位">
    </div>
    <div class="auth-buttons">
      <button class="btn-primary" id="authLogin">登录</button>
      <button class="btn-secondary" id="authSignup">注册</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
  </div>

  <!-- Main app (hidden until auth) -->
  <div id="appSection" style="display:none">
    <div class="user-bar">
      <span>已登录：<span class="email" id="userEmail"></span></span>
      <button id="btnLogout">退出</button>
    </div>

    <div class="form-section">
      <div class="row">
        <div class="field" style="min-width:140px">
          <label>性别</label>
          <div class="gender-toggle" id="genderToggle">
            <button class="active" data-gender="male">男</button>
            <button data-gender="female">女</button>
          </div>
        </div>
        <div class="field">
          <label>身高 (cm) *</label>
          <input type="number" id="height" placeholder="175" min="100" max="250" step="0.1">
        </div>
        <div class="field">
          <label>体重 (kg) · 选填</label>
          <input type="number" id="weight" placeholder="70" min="30" max="300" step="0.1">
        </div>
        <div class="field">
          <label>年龄 · 选填</label>
          <input type="number" id="age" placeholder="22" min="10" max="100">
        </div>
      </div>
    </div>

    <div class="photo-panels">
      <div class="photo-panel" id="frontPanel">
        <span class="label-tag">正面照</span>
        <div class="placeholder"><span class="icon">🧍</span><span>点击上传正面照</span></div>
        <img id="frontImg" style="display:none" alt="正面">
        <canvas id="frontCanvas" style="display:none"></canvas>
        <button class="retake-btn" id="frontRetake" style="display:none">重拍</button>
        <div class="upload-actions">
          <button id="frontUpload">📁 上传</button>
          <button id="frontCamera">📷 拍照</button>
        </div>
        <input type="file" id="frontInput" accept="image/*" hidden>
        <input type="file" id="frontCamInput" accept="image/*" capture="environment" hidden>
      </div>
      <div class="photo-panel" id="sidePanel">
        <span class="label-tag">侧面照</span>
        <div class="placeholder"><span class="icon">🧍</span><span>点击上传侧面照</span></div>
        <img id="sideImg" style="display:none" alt="侧面">
        <canvas id="sideCanvas" style="display:none"></canvas>
        <button class="retake-btn" id="sideRetake" style="display:none">重拍</button>
        <div class="upload-actions">
          <button id="sideUpload">📁 上传</button>
          <button id="sideCamera">📷 拍照</button>
        </div>
        <input type="file" id="sideInput" accept="image/*" hidden>
        <input type="file" id="sideCamInput" accept="image/*" capture="environment" hidden>
      </div>
    </div>

    <p style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:12px">
      建议：穿紧身/少衣，纯色背景，站直，手臂自然下垂稍张开。
    </p>

    <button class="btn-analyze" id="btnAnalyze" disabled>请先上传正面和侧面照片</button>

    <div class="results" id="results"></div>

    <!-- History -->
    <div class="history-section" id="historySection">
      <h3>历史记录</h3>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      <div id="historyTableWrap"></div>
    </div>
  </div>

  <div class="error-toast" id="errorToast"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/@mediapipe/pose@0.5/pose.js"></script>

<script>
// --- Supabase ---
const SUPABASE_URL = 'https://zervceroblktwwacagui.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RIfI7qctop1zzcb5ENHizA_68AamSFy';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- State ---
let gender = 'male';
let frontLandmarks = null;
let sideLandmarks = null;
let frontImageData = null;
let sideImageData = null;
let currentUser = null;
let chartInstance = null;

// --- DOM refs ---
const $ = id => document.getElementById(id);
const authSection = $('authSection');
const appSection = $('appSection');
const frontPanel = $('frontPanel');
const sidePanel = $('sidePanel');
const frontImg = $('frontImg');
const sideImg = $('sideImg');
const frontCanvas = $('frontCanvas');
const sideCanvas = $('sideCanvas');
const btnAnalyze = $('btnAnalyze');
const resultsDiv = $('results');
const errorToast = $('errorToast');
const heightInput = $('height');
const historySection = $('historySection');

// --- Toast ---
let toastTimer;
function showToast(msg) {
  errorToast.textContent = msg;
  errorToast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => errorToast.style.display = 'none', 3000);
}

// --- Auth ---
// --- Auth ---
$('authLogin').addEventListener('click', () => handleAuth('login'));
$('authSignup').addEventListener('click', () => handleAuth('signup'));

async function handleAuth(mode) {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const errEl = $('authError');

  if (!email || !password) {
    errEl.textContent = '请填写邮箱和密码';
    errEl.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = '密码至少6位';
    errEl.style.display = 'block';
    return;
  }

  errEl.style.display = 'none';
  const btn = mode === 'login' ? $('authLogin') : $('authSignup');
  btn.disabled = true;
  btn.textContent = '处理中...';

  let result;
  if (mode === 'signup') {
    result = await supabase.auth.signUp({ email, password });
  } else {
    result = await supabase.auth.signInWithPassword({ email, password });
  }

  btn.disabled = false;
  btn.textContent = mode === 'login' ? '登录' : '注册';

  if (result.error) {
    if (result.error.message.includes('Invalid login') && mode === 'login') {
      errEl.textContent = '账号不存在或密码错误';
    } else {
      errEl.textContent = result.error.message;
    }
    errEl.style.display = 'block';
  } else if (mode === 'signup' && result.data.user && !result.data.session) {
    errEl.textContent = '注册成功！请点击"登录"按钮登录';
    errEl.style.color = 'var(--success)';
    errEl.style.display = 'block';
    $('authPassword').value = '';
  } else {
    onLogin(result.data.user);
  }
}
  }
});

$('btnLogout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  onLogout();
});

async function checkSession() {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    onLogin(data.session.user);
  }
}

function onLogin(user) {
  currentUser = user;
  $('userEmail').textContent = user.email;
  authSection.style.display = 'none';
  appSection.style.display = 'block';
  loadHistory();
}

function onLogout() {
  currentUser = null;
  authSection.style.display = 'block';
  appSection.style.display = 'none';
  $('authEmail').value = '';
  $('authPassword').value = '';
}

// --- Gender toggle ---
$('genderToggle').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  gender = e.target.dataset.gender;
  $('genderToggle').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  updateAnalyzeButton();
});

// --- Photo setup ---
function setupPhotoPanel(panel, img, canvas, uploadBtn, cameraBtn, retakeBtn, input, camInput, id) {
  panel.addEventListener('dragover', e => { e.preventDefault(); panel.style.borderColor = '#c4943a'; });
  panel.addEventListener('dragleave', () => { if (!img.src) panel.style.borderColor = ''; });
  panel.addEventListener('drop', e => {
    e.preventDefault();
    panel.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadPhoto(file, id);
  });
  uploadBtn.addEventListener('click', e => { e.stopPropagation(); input.click(); });
  cameraBtn.addEventListener('click', e => { e.stopPropagation(); camInput.click(); });
  input.addEventListener('change', () => { if (input.files[0]) loadPhoto(input.files[0], id); });
  camInput.addEventListener('change', () => { if (camInput.files[0]) loadPhoto(camInput.files[0], id); });
  panel.addEventListener('click', () => { if (!img.src) input.click(); });
  retakeBtn.addEventListener('click', e => {
    e.stopPropagation();
    img.style.display = 'none'; img.src = '';
    canvas.style.display = 'none'; retakeBtn.style.display = 'none';
    panel.classList.remove('has-photo');
    panel.querySelector('.placeholder').style.display = '';
    panel.querySelector('.upload-actions').style.display = '';
    if (id === 'front') { frontLandmarks = null; frontImageData = null; }
    else { sideLandmarks = null; sideImageData = null; }
    updateAnalyzeButton();
    resultsDiv.classList.remove('visible');
  });
}

function loadPhoto(file, id) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = id === 'front' ? frontImg : sideImg;
    const canvas = id === 'front' ? frontCanvas : sideCanvas;
    const panel = id === 'front' ? frontPanel : sidePanel;
    const retakeBtn = id === 'front' ? $('frontRetake') : $('sideRetake');
    img.onload = () => {
      img.style.display = 'block';
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.style.display = 'none';
      retakeBtn.style.display = 'block';
      panel.classList.add('has-photo');
      panel.querySelector('.placeholder').style.display = 'none';
      panel.querySelector('.upload-actions').style.display = 'none';
      if (id === 'front') { frontLandmarks = null; frontImageData = img; }
      else { sideLandmarks = null; sideImageData = img; }
      runPoseDetection(img, canvas, id);
      updateAnalyzeButton();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

setupPhotoPanel(frontPanel, frontImg, frontCanvas,
  $('frontUpload'), $('frontCamera'), $('frontRetake'),
  $('frontInput'), $('frontCamInput'), 'front');
setupPhotoPanel(sidePanel, sideImg, sideCanvas,
  $('sideUpload'), $('sideCamera'), $('sideRetake'),
  $('sideInput'), $('sideCamInput'), 'side');

// --- MediaPipe Pose ---
let poseInstance = null;
function initPose() {
  return new Promise((resolve) => {
    poseInstance = new Pose({
      locateFile: file => `https://unpkg.com/@mediapipe/pose@0.5/${file}`
    });
    poseInstance.setOptions({
      modelComplexity: 2, smoothLandmarks: true, enableSegmentation: false,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    poseInstance.onResults(results => {
      if (results.poseLandmarks) window._poseResult = results;
    });
    poseInstance.initialize().then(() => resolve());
  });
}

async function runPoseDetection(img, canvas, id) {
  if (!poseInstance) await initPose();
  const offscreen = new Image();
  offscreen.src = img.src;
  await new Promise(r => { offscreen.onload = r; });
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = offscreen.naturalWidth;
  tempCanvas.height = offscreen.naturalHeight;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(offscreen, 0, 0);
  window._poseResult = null;
  await poseInstance.send({ image: tempCanvas });
  const result = window._poseResult;
  if (result && result.poseLandmarks) {
    if (id === 'front') frontLandmarks = result.poseLandmarks;
    else sideLandmarks = result.poseLandmarks;
    drawLandmarks(canvas, result.poseLandmarks, id);
  } else {
    showToast((id === 'front' ? '正面' : '侧面') + '照片未检测到人体，请换张照片试试');
  }
}

function drawLandmarks(canvas, landmarks, id) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;
  const pts = landmarks.map(l => ({ x: l.x * w, y: l.y * h }));
  const chinY = (pts[9].y + pts[10].y) / 2;
  const shoulderMidY = (pts[11].y + pts[12].y) / 2;
  const hipMidY = (pts[23].y + pts[24].y) / 2;
  const neckY = chinY + (shoulderMidY - chinY) * 0.30;
  const waistY = shoulderMidY + (hipMidY - shoulderMidY) * 0.57;
  ctx.strokeStyle = 'rgba(196,148,58,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([8, 4]);
  [neckY, waistY, hipMidY].forEach(y => {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });
  ctx.setLineDash([]); ctx.fillStyle = '#c4943a'; ctx.font = '12px system-ui';
  ctx.fillText('颈', 8, neckY - 4);
  ctx.fillText('腰', 8, waistY - 4);
  ctx.fillText('臀', 8, hipMidY - 4);
  [0,7,8,11,12,23,24,25,26].forEach(i => {
    ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c4943a'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  });
  canvas.style.display = 'block';
}

// --- Measurement helpers ---
function getWidthAtY(landmarks, yRatio, w, h) {
  const pts = landmarks.map(l => ({ x: l.x * w, y: l.y * h }));
  const shoulderL = pts[11].x, shoulderR = pts[12].x;
  const hipL = pts[23].x, hipR = pts[24].x;
  return Math.abs((shoulderR + (hipR - shoulderR) * yRatio) - (shoulderL + (hipL - shoulderL) * yRatio));
}

function getDepthAtY(landmarks, yRatio, w, h) {
  const pts = landmarks.map(l => ({ x: l.x * w, y: l.y * h }));
  const shoulderMidY = (pts[11].y + pts[12].y) / 2;
  const hipMidY = (pts[23].y + pts[24].y) / 2;
  const targetY = shoulderMidY + (hipMidY - shoulderMidY) * yRatio;
  const relevantPts = [11, 12, 23, 24, 0];
  let minX = Infinity, maxX = -Infinity;
  relevantPts.forEach(i => {
    if (Math.abs(pts[i].y - targetY) < h * 0.35) {
      minX = Math.min(minX, pts[i].x);
      maxX = Math.max(maxX, pts[i].x);
    }
  });
  if (minX === Infinity) return getWidthAtY(landmarks, yRatio, w, h) * 0.7;
  return maxX - minX;
}

function estimateCircumference(frontWidth, sideDepth) {
  if (frontWidth <= 0 || sideDepth <= 0) return 0;
  const a = frontWidth / 2, b = sideDepth / 2;
  return Math.PI * Math.sqrt((a * a + b * b) / 2) * 2;
}

function navyFormula(gender, heightCm, neckCm, waistCm, hipCm) {
  if (gender === 'male') {
    return 86.010 * Math.log10(waistCm - neckCm) - 70.041 * Math.log10(heightCm) + 36.76;
  } else {
    return 163.205 * Math.log10(waistCm + hipCm - neckCm) - 97.684 * Math.log10(heightCm) - 78.387;
  }
}

function getBFCategory(bf, g) {
  if (g === 'male') {
    if (bf < 6)  return ['excellent', '过低'];
    if (bf < 14) return ['excellent', '健美'];
    if (bf < 18) return ['good', '健康'];
    if (bf < 25) return ['fair', '正常'];
    if (bf < 30) return ['poor', '偏高'];
    return ['high', '过高'];
  } else {
    if (bf < 14) return ['excellent', '过低'];
    if (bf < 21) return ['excellent', '健美'];
    if (bf < 25) return ['good', '健康'];
    if (bf < 32) return ['fair', '正常'];
    if (bf < 38) return ['poor', '偏高'];
    return ['high', '过高'];
  }
}

// --- Analysis + Save ---
let lastResultData = null;

async function analyze() {
  const heightCm = parseFloat(heightInput.value);
  if (!heightCm || heightCm < 100 || heightCm > 250) {
    showToast('请输入有效身高 (100-250 cm)'); return;
  }
  if (!frontLandmarks || !sideLandmarks) {
    showToast('请确保两张照片都已上传并检测到人体'); return;
  }

  const fw = frontImageData.naturalWidth, fh = frontImageData.naturalHeight;
  const sw = sideImageData.naturalWidth, sh = sideImageData.naturalHeight;

  const frontYs = frontLandmarks.map(l => l.y * fh);
  const frontPixelHeight = Math.max(...frontYs) - Math.min(...frontYs);
  const sideYs = sideLandmarks.map(l => l.y * sh);
  const sidePixelHeight = Math.max(...sideYs) - Math.min(...sideYs);
  const DETECTION_COVERAGE = 0.94;
  const frontScale = (heightCm * DETECTION_COVERAGE) / frontPixelHeight;
  const sideScale = (heightCm * DETECTION_COVERAGE) / sidePixelHeight;

  const neckFrontW = getWidthAtY(frontLandmarks, 0.05, fw, fh);
  const neckSideD = getDepthAtY(sideLandmarks, 0.05, sw, sh);
  const waistFrontW = getWidthAtY(frontLandmarks, 0.57, fw, fh);
  const waistSideD = getDepthAtY(sideLandmarks, 0.57, sw, sh);
  const hipFrontW = getWidthAtY(frontLandmarks, 0.95, fw, fh);
  const hipSideD = getDepthAtY(sideLandmarks, 0.95, sw, sh);

  const neckCm = estimateCircumference(neckFrontW * frontScale, neckSideD * sideScale);
  const waistCm = estimateCircumference(waistFrontW * frontScale, waistSideD * sideScale);
  const hipCm = estimateCircumference(hipFrontW * frontScale, hipSideD * sideScale);

  if (neckCm < 20 || neckCm > 60 || waistCm < 40 || waistCm > 150) {
    showToast('测量结果异常，请确认照片姿势正确（正面+侧面，站直）'); return;
  }

  let bf = navyFormula(gender, heightCm, neckCm, waistCm, hipCm);
  bf = Math.max(2, Math.min(50, bf));
  const [category, label] = getBFCategory(bf, gender);

  const weightKg = parseFloat($('weight').value) || null;
  const ageVal = parseInt($('age').value) || null;
  const fatMass = weightKg ? (weightKg * bf / 100).toFixed(1) : null;
  const leanMass = weightKg ? (weightKg - fatMass).toFixed(1) : null;
  const indicatorPct = Math.min(95, Math.max(5, (bf / 40) * 100));

  resultsDiv.innerHTML = `
    <div class="bf-big-number">
      <div class="bf-value ${category}">${bf.toFixed(1)}%</div>
      <div class="bf-label">体脂率 · ${label}</div>
    </div>
    <div class="bf-scale">
      <div class="seg e"></div><div class="seg g"></div>
      <div class="seg f"></div><div class="seg p"></div><div class="seg h"></div>
    </div>
    <div class="bf-indicator">
      <div class="arrow" style="left:${indicatorPct}%">▼</div>
    </div>
    <div class="measurements-grid">
      <div class="meas-card"><div class="val">${neckCm.toFixed(1)}</div><div class="lbl">颈围 (cm)</div></div>
      <div class="meas-card"><div class="val">${waistCm.toFixed(1)}</div><div class="lbl">腰围 (cm)</div></div>
      <div class="meas-card"><div class="val">${hipCm.toFixed(1)}</div><div class="lbl">臀围 (cm)</div></div>
      ${fatMass ? `
      <div class="meas-card"><div class="val">${fatMass} kg</div><div class="lbl">脂肪重量</div></div>
      <div class="meas-card"><div class="val">${leanMass} kg</div><div class="lbl">去脂体重</div></div>
      ` : ''}
      <div class="meas-card"><div class="val">${heightCm} cm</div><div class="lbl">身高</div></div>
    </div>
    <div class="disclaimer">⚠️ 本结果基于2D照片+US Navy公式估算，与DEXA等黄金标准存在±3-5%的误差范围。仅用于趋势追踪参考，不能替代专业体测。建议每周同一时间、同一条件下拍照对比。</div>
  `;
  resultsDiv.classList.add('visible');
  resultsDiv.scrollIntoView({ behavior: 'smooth' });

  // Save to Supabase
  lastResultData = { heightCm, weightKg, ageVal, neckCm, waistCm, hipCm, bf, category };
  if (currentUser) {
    const { error } = await supabase.from('measurements').insert({
      user_id: currentUser.id,
      height_cm: heightCm, weight_kg: weightKg, age: ageVal, gender,
      neck_cm: neckCm, waist_cm: waistCm, hip_cm: hipCm,
      body_fat_pct: bf, category
    });
    if (error) {
      console.error('Save error:', error);
      showToast('保存失败，请检查网络后重试');
    } else {
      showToast('已保存到云端 ✓');
      loadHistory();
    }
  }
}

$('btnAnalyze').addEventListener('click', analyze);

function updateAnalyzeButton() {
  const ready = !!(frontImageData?.src && sideImageData?.src &&
                   frontLandmarks && sideLandmarks && heightInput.value);
  btnAnalyze.disabled = !ready;
  btnAnalyze.textContent = ready ? '开始分析' :
    (!frontImageData?.src || !sideImageData?.src) ? '请先上传正面和侧面照片' :
    '正在检测人体姿态...';
}
heightInput.addEventListener('input', updateAnalyzeButton);
setInterval(updateAnalyzeButton, 1000);

// --- History ---
async function loadHistory() {
  if (!currentUser) return;

  const { data, error } = await supabase
    .from('measurements')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error) { console.error('Load error:', error); return; }

  if (!data || data.length === 0) {
    $('historyTableWrap').innerHTML = '<div class="no-history">暂无历史记录，完成一次测量后自动保存</div>';
    historySection.classList.add('visible');
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    return;
  }

  historySection.classList.add('visible');

  // Trend chart
  const chartData = [...data].reverse(); // chronological
  const labels = chartData.map(d => new Date(d.created_at).toLocaleDateString('zh-CN', { month:'short', day:'numeric' }));
  const bfValues = chartData.map(d => d.body_fat_pct);

  const ctx = $('trendChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '体脂率 %',
        data: bfValues,
        borderColor: '#c4943a',
        backgroundColor: 'rgba(196,148,58,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#c4943a',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
      },
      scales: {
        x: { ticks: { color: '#888', font: { size: 11 } }, grid: { color: 'rgba(42,42,56,0.5)' } },
        y: {
          ticks: { color: '#888', font: { size: 11 }, callback: v => v + '%' },
          grid: { color: 'rgba(42,42,56,0.5)' },
          min: Math.max(0, Math.min(...bfValues) - 5),
          max: Math.min(50, Math.max(...bfValues) + 5),
        }
      }
    }
  });

  // Table
  $('historyTableWrap').innerHTML = `
    <table class="history-table">
      <thead><tr>
        <th>日期</th><th>体脂率</th><th>颈围</th><th>腰围</th><th>臀围</th><th>分类</th><th></th>
      </tr></thead>
      <tbody>
        ${data.map(d => `
          <tr>
            <td>${new Date(d.created_at).toLocaleDateString('zh-CN')}</td>
            <td><strong>${d.body_fat_pct}%</strong></td>
            <td>${d.neck_cm}cm</td><td>${d.waist_cm}cm</td><td>${d.hip_cm}cm</td>
            <td>${d.category}</td>
            <td><button class="delete-btn" data-id="${d.id}" title="删除">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  // Delete handlers
  $('historyTableWrap').querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      await supabase.from('measurements').delete().eq('id', id).eq('user_id', currentUser.id);
      loadHistory();
    });
  });
}

// --- Init ---
initPose();
checkSession();
</script>
