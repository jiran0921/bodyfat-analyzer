<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体脂率估算</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --border: #2a2a38;
      --text: #e0e0e0;
      --text-secondary: #888;
      --accent: #c4943a;
      --accent-glow: rgba(196,148,58,0.3);
      --danger: #d44;
      --success: #4a8;
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    header {
      text-align: center; padding: 24px 0 16px;
    }
    header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.02em; }
    .badge {
      display: inline-block; background: var(--accent); color: #000;
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; margin-left: 8px; vertical-align: middle; text-transform: uppercase;
    }
    header .subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }

    /* Auth */
    .auth-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
    }
    .auth-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
    .auth-section .field { margin-bottom: 12px; }
    .auth-section .field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
    .auth-section .field input {
      width: 100%; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.95rem; outline: none;
    }
    .auth-section .field input:focus { border-color: var(--accent); }
    .auth-buttons { display: flex; gap: 8px; }
    .auth-buttons button {
      flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: all 0.2s; border: 1px solid var(--accent);
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { box-shadow: 0 0 16px var(--accent-glow); }
    .btn-secondary { background: transparent; color: var(--accent); }
    .btn-secondary:hover { background: rgba(196,148,58,0.1); }
    .auth-error { color: var(--danger); font-size: 0.8rem; margin-top: 8px; display: none; }
    .auth-switch { text-align: center; margin-top: 12px; font-size: 0.8rem; color: var(--text-secondary); }
    .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }

    /* User bar */
    .user-bar {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 16px; font-size: 0.8rem; color: var(--text-secondary);
    }
    .user-bar .email { color: var(--accent); }
    .user-bar button {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
      transition: all 0.2s;
    }
    .user-bar button:hover { border-color: var(--danger); color: var(--danger); }

    /* Form */
    .form-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .form-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 100px; margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .gender-toggle { display: flex; gap: 8px; }
    .gender-toggle button {
      flex: 1; padding: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text-secondary); border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }
    .gender-toggle button.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

    /* Photo panels */
    .photo-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 500px) { .photo-panels { grid-template-columns: 1fr; } }
    .photo-panel {
      background: var(--surface); border: 2px dashed var(--border);
      border-radius: var(--radius); overflow: hidden; position: relative;
      aspect-ratio: 3/4; cursor: pointer; transition: border-color 0.2s;
    }
    .photo-panel:hover { border-color: var(--accent); }
    .photo-panel.has-photo { border-style: solid; border-color: var(--accent); }
    .photo-panel .placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--text-secondary); pointer-events: none;
    }
    .photo-panel .placeholder .icon { font-size: 2rem; opacity: 0.5; }
    .photo-panel img, .photo-panel canvas { width: 100%; height: 100%; object-fit: contain; }
    .photo-panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo-panel .label-tag {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
      color: var(--accent); font-size: 0.75rem; padding: 4px 10px;
      border-radius: 4px; z-index: 2; pointer-events: none;
    }
    .photo-panel .retake-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
      border: 1px solid var(--border); color: var(--text); font-size: 0.7rem;
      padding: 4px 10px; border-radius: 4px; cursor: pointer; z-index: 2;
    }
    .photo-panel .retake-btn:hover { background: var(--danger); }
    .upload-actions {
      display: flex; gap: 8px; position: absolute; bottom: 12px;
      left: 50%; transform: translateX(-50%); z-index: 2;
    }
    .upload-actions button {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.8); color: var(--text); font-size: 0.75rem;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .upload-actions button:hover { background: var(--accent); color:#000; }
    .photo-panel.has-photo .upload-actions { display: none; }

    /* Buttons */
    .btn-analyze {
      width: 100%; padding: 14px; background: var(--accent); color: #000;
      border: none; border-radius: var(--radius); font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em;
    }
    .btn-analyze:hover { box-shadow: 0 0 24px var(--accent-glow); }
    .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* Results */
    .results {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-top: 16px; display: none;
    }
    .results.visible { display: block; }
    .bf-big-number { text-align: center; margin-bottom: 20px; }
    .bf-value { font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
    .bf-value.excellent { color: #4a8; } .bf-value.good { color: #8b4; }
    .bf-value.fair { color: var(--accent); } .bf-value.poor { color: #d84; }
    .bf-value.high { color: var(--danger); }
    .bf-label { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
    .bf-scale {
      display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px;
    }
    .bf-scale .seg { flex: 1; }
    .bf-scale .seg.e { background: #4a8; } .bf-scale .seg.g { background: #8b4; }
    .bf-scale .seg.f { background: var(--accent); } .bf-scale .seg.p { background: #d84; }
    .bf-scale .seg.h { background: var(--danger); }
    .bf-indicator { position: relative; height: 20px; margin-bottom: 18px; }
    .bf-indicator .arrow {
      position: absolute; top: 0; transform: translateX(-50%);
      font-size: 0.8rem; transition: left 0.5s ease;
    }
    .measurements-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .meas-card {
      background: var(--bg); border-radius: 8px; padding: 12px; text-align: center;
    }
    .meas-card .val { font-size: 1.3rem; font-weight: 700; }
    .meas-card .lbl { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
    .disclaimer {
      margin-top: 16px; padding: 12px; background: rgba(196,148,58,0.08);
      border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
      font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5;
    }

    /* History */
    .history-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-top: 16px; display: none;
    }
    .history-section.visible { display: block; }
    .history-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; color: var(--accent); }
    .chart-wrap { margin-bottom: 20px; position: relative; height: 220px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .history-table th {
      text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
      color: var(--text-secondary); font-weight: 600; font-size: 0.72rem;
    }
    .history-table td {
      padding: 8px 6px; border-bottom: 1px solid rgba(42,42,56,0.5);
    }
    .history-table .delete-btn {
      background: transparent; border: none; color: var(--text-secondary);
      cursor: pointer; font-size: 0.9rem; padding: 2px 6px; opacity: 0.5;
      transition: all 0.2s;
    }
    .history-table .delete-btn:hover { opacity: 1; color: var(--danger); }
    .no-history {
      text-align: center; color: var(--text-secondary); padding: 24px; font-size: 0.85rem;
    }

    /* Toast */
    .error-toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 0.85rem; z-index: 100;
      animation: fadeIn 0.3s; display: none;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(-8px); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>体脂率估算<span class="badge">Pro</span></h1>
    <p class="subtitle">正面 + 侧面各一张照片，US Navy 公式估算 · 云端记录</p>
  </header>

  <!-- Auth UI -->
  <div class="auth-section" id="authSection">
    <h3>登录或注册</h3>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="your@email.com">
    </div>
    <div class="field">
      <label>密码（至少6位）</label>
      <input type="password" id="authPassword" placeholder="至少6位">
    </div>
    <div class="auth-buttons">
      <button class="btn-primary" id="authLogin">登录</button>
      <button class="btn-secondary" id="authSignup">注册</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
  </div>

  <!-- Main app (hidden until auth) -->
  <div id="appSection" style="display:none">
    <div class="user-bar">
      <span>已登录：<span class="email" id="userEmail"></span></span>
      <button id="btnLogout">退出</button>
    </div>

    <div class="form-section">
      <div class="row">
        <div class="field" style="min-width:140px">
          <label>性别</label>
          <div class="gender-toggle" id="genderToggle">
            <button class="active" data-gender="male">男</button>
            <button data-gender="female">女</button>
          </div>
        </div>
        <div class="field">
          <label>身高 (cm) *</label>
          <input type="number" id="height" placeholder="175" min="100" max="250" step="0.1">
        </div>
        <div class="field">
          <label>体重 (kg) · 选填</label>
          <input type="number" id="weight" placeholder="70" min="30" max="300" step="0.1">
        </div>
        <div class="field">
          <label>年龄 · 选填</label>
          <input type="number" id="age" placeholder="22" min="10" max="100">
        </div>
      </div>
    </div>

    <div class="photo-panels">
      <div class="photo-panel" id="frontPanel">
        <span class="label-tag">正面照</span>
        <div class="placeholder"><span class="icon">🧍</span><span>点击上传正面照</span></div>
        <img id="frontImg" style="display:none" alt="正面">
        <canvas id="frontCanvas" style="display:none"></canvas>
        <button class="retake-btn" id="frontRetake" style="display:none">重拍</button>
        <div class="upload-actions">
          <button id="frontUpload">📁 上传</button>
          <button id="frontCamera">📷 拍照</button>
        </div>
        <input type="file" id="frontInput" accept="image/*" hidden>
        <input type="file" id="frontCamInput" accept="image/*" capture="environment" hidden>
      </div>
      <div class="photo-panel" id="sidePanel">
        <span class="label-tag">侧面照</span>
        <div class="placeholder"><span class="icon">🧍</span><span>点击上传侧面照</span></div>
        <img id="sideImg" style="display:none" alt="侧面">
        <canvas id="sideCanvas" style="display:none"></canvas>
        <button class="retake-btn" id="sideRetake" style="display:none">重拍</button>
        <div class="upload-actions">
          <button id="sideUpload">📁 上传</button>
          <button id="sideCamera">📷 拍照</button>
        </div>
        <input type="file" id="sideInput" accept="image/*" hidden>
        <input type="file" id="sideCamInput" accept="image/*" capture="environment" hidden>
      </div>
    </div>

    <p style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:12px">
      建议：穿紧身/少衣，纯色背景，站直，手臂自然下垂稍张开。
    </p>

    <button class="btn-analyze" id="btnAnalyze" disabled>请先上传正面和侧面照片</button>

    <div class="results" id="results"></div>

    <!-- History -->
    <div class="history-section" id="historySection">
      <h3>历史记录</h3>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      <div id="historyTableWrap"></div>
    </div>
  </div>

  <div class="error-toast" id="errorToast"></div>
</div>

<script src="lib/chart.umd.min.js"></script>
<script src="lib/pose.js"></script>

<script src="lib/app.js"></script>
</html>
